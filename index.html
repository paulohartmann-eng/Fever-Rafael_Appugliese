<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rafael Appugliese | Fever</title>
  <style>
    :root {
      --navy: #0e1a2b;
      --navy-2: #1a2a44;
      --pink: #ff3d7f;
      --pink-hover: #e8316f;
      --texto: #0e1a2b;
      --cinza: #6b7280;
      --borda: #e6e8ee;
      --fundo-suave: #f7f8fb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--fundo-suave); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--texto);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .pagina {
      max-width: 440px;
      margin: 0 auto;
      min-height: 100vh;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    /* Cabeçalho */
    .topo {
      background: radial-gradient(120% 80% at 50% 0%, var(--navy-2) 0%, var(--navy) 70%);
      color: #fff;
      text-align: center;
      padding: 44px 24px 96px;
      position: relative;
    }
    .marca {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--pink);
    }
    .marca::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 12px var(--pink);
    }
    .avatar {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      margin: 26px auto 0;
      background: var(--pink);
      border: 4px solid #fff;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }
    .avatar span { font-size: 2.2rem; font-weight: 700; color: #fff; }
    .avatar img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Bloco de identidade, sobreposto ao cabeçalho */
    .identidade {
      margin-top: -56px;
      padding: 0 24px;
      text-align: center;
      position: relative;
    }
    .identidade .nome-topo {
      display: none;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #fff;
      margin-top: 0;
    }
    .cargo {
      margin: 8px auto 0;
      max-width: 340px;
      font-size: 0.95rem;
      color: #cbd2e0;
      line-height: 1.45;
    }

    /* Conteúdo */
    .conteudo {
      padding: 26px 20px 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }
    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 18px;
      border-radius: 16px;
      border: 1.5px solid var(--borda);
      background: #fff;
      color: var(--texto);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 1px 2px rgba(14, 26, 43, 0.04);
    }
    .btn:active { transform: scale(0.98); }
    .btn svg { width: 22px; height: 22px; flex-shrink: 0; }
    .btn .texto { flex: 1; text-align: left; }
    .btn .seta { color: #b0b6c3; font-size: 1.1rem; }
    .btn:hover { background: #fafbfd; }

    .btn.principal {
      background: var(--pink);
      border-color: var(--pink);
      color: #fff;
      box-shadow: 0 10px 24px rgba(255, 61, 127, 0.28);
    }
    .btn.principal:hover { background: var(--pink-hover); }
    .btn.principal .seta { color: rgba(255,255,255,0.8); }

    .btn.escuro {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
    }
    .btn.escuro:hover { background: var(--navy-2); }
    .btn.escuro .seta { color: rgba(255,255,255,0.6); }

    .icone {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .btn.principal .icone { background: rgba(255,255,255,0.2); }
    .btn.escuro .icone { background: rgba(255,255,255,0.12); }
    .btn:not(.principal):not(.escuro) .icone { background: #f1f3f8; color: var(--navy); }

    .separador {
      margin: 10px 0 2px;
      height: 1px;
      background: var(--borda);
    }

    .rodape {
      margin-top: auto;
      padding-top: 18px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--cinza);
    }
    .rodape a {
      color: var(--texto);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="pagina">
    <header class="topo">
      <div class="marca">Fever</div>
      <div class="avatar">
        <span>RA</span>
        <img src="foto.jpg" alt="Rafael Appugliese" onerror="this.remove()">
      </div>
    </header>

    <section class="identidade">
      <h1>Rafael Appugliese</h1>
      <p class="cargo">Music &amp; Nightlife Senior Market Strategy and Partnerships Manager</p>
    </section>

    <section class="conteudo">
      <a class="btn principal" href="https://wa.me/5511999008555" target="_blank" rel="noopener">
        <span class="icone">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5A11 11 0 0 0 3.2 17.3L2 22l4.8-1.2A11 11 0 1 0 20.5 3.5zM12 20.2a9.2 9.2 0 0 1-4.7-1.3l-.3-.2-2.9.8.8-2.8-.2-.3A9.2 9.2 0 1 1 12 20.2zm5-6.9c-.3-.1-1.6-.8-1.8-.9s-.4-.1-.6.1-.7.9-.8 1-.3.2-.6.1a7.5 7.5 0 0 1-2.2-1.4 8.3 8.3 0 0 1-1.5-1.9c-.2-.3 0-.5.1-.6l.4-.5.3-.4c.1-.2 0-.3 0-.5l-.8-2c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 2.9 2.9 0 0 0-.9 2.2 5 5 0 0 0 1.1 2.7 11.4 11.4 0 0 0 4.4 3.9c.6.3 1.1.4 1.5.5a3.6 3.6 0 0 0 1.7.1 2.8 2.8 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c0-.1-.2-.2-.5-.3z"/></svg>
        </span>
        <span class="texto">WhatsApp</span>
        <span class="seta">›</span>
      </a>

      <a class="btn escuro" href="tel:+5511999008555">
        <span class="icone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
        </span>
        <span class="texto">Ligar</span>
        <span class="seta">›</span>
      </a>

      <a class="btn" href="https://www.linkedin.com/in/appugliese/" target="_blank" rel="noopener">
        <span class="icone">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.4 20.5h-3.6v-5.6c0-1.3 0-3-1.8-3s-2.1 1.4-2.1 2.9v5.7H9.4V9h3.4v1.6c.5-.9 1.6-1.8 3.4-1.8 3.6 0 4.3 2.4 4.3 5.5v6.2zM5.3 7.4a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2zM7.1 20.5H3.5V9h3.6v11.5z"/></svg>
        </span>
        <span class="texto">LinkedIn</span>
        <span class="seta">›</span>
      </a>

      <a class="btn" href="https://www.feverup.com" target="_blank" rel="noopener">
        <span class="icone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
        </span>
        <span class="texto">Site da Fever</span>
        <span class="seta">›</span>
      </a>

      <button class="btn" id="salvar" type="button">
        <span class="icone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        </span>
        <span class="texto">Salvar contato</span>
        <span class="seta">›</span>
      </button>

      <div class="separador"></div>

      <p class="rodape">
        <a href="tel:+5511999008555">+55 11 99900-8555</a>
      </p>
    </section>
  </main>

  <script>
    const vcard = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:Appugliese;Rafael;;;",
      "FN:Rafael Appugliese",
      "ORG:Fever",
      "TITLE:Music & Nightlife Senior Market Strategy and Partnerships Manager",
      "TEL;TYPE=CELL,VOICE:+5511999008555",
      "URL:https://www.linkedin.com/in/appugliese/",
      "END:VCARD"
    ].join("\r\n");

    document.getElementById("salvar").addEventListener("click", () => {
      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "rafael-appugliese.vcf";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
