<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <title>Rafael Appugliese | Fever</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --surface: #141418;
      --pink: #ee2a62;
      --pink-hover: #d91f55;
      --branco: #ffffff;
      --texto-2: #a3a3ad;
      --linha: rgba(255, 255, 255, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--branco);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .pagina {
      max-width: 440px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 40px 22px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo Fever */
    .logo {
      height: 34px;
      width: auto;
      display: block;
    }
    .logo-tag {
      height: 22px;
      width: auto;
      display: block;
      margin: 16px auto 0;
    }

    /* Foto */
    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      margin-top: 36px;
      background: var(--surface);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 3px var(--pink), 0 20px 50px rgba(238, 42, 98, 0.25);
    }
    .avatar span { font-size: 2.4rem; font-weight: 800; color: var(--pink); }
    .avatar img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Identidade */
    h1 {
      margin-top: 24px;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.6px;
      text-align: center;
    }
    .cargo {
      margin-top: 8px;
      max-width: 320px;
      font-size: 0.95rem;
      line-height: 1.45;
      color: var(--texto-2);
      text-align: center;
    }

    /* Botões */
    .acoes {
      width: 100%;
      margin-top: 34px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 14px 18px 14px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--linha);
      background: transparent;
      color: var(--branco);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.12s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn:hover { border-color: rgba(255, 255, 255, 0.35); background: rgba(255, 255, 255, 0.04); }

    .icone {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }
    .icone svg { width: 20px; height: 20px; }
    .btn .texto { flex: 1; text-align: left; }
    .btn .seta { color: var(--texto-2); font-size: 1.2rem; padding-right: 4px; }

    .btn.principal {
      background: var(--pink);
      border-color: var(--pink);
      box-shadow: 0 12px 30px rgba(238, 42, 98, 0.35);
    }
    .btn.principal:hover { background: var(--pink-hover); border-color: var(--pink-hover); }
    .btn.principal .icone { background: rgba(255, 255, 255, 0.2); }
    .btn.principal .seta { color: rgba(255, 255, 255, 0.85); }

    /* Rodapé */
    .rodape {
      margin-top: auto;
      padding-top: 36px;
      font-size: 0.85rem;
      color: var(--texto-2);
      text-align: center;
    }
    .rodape a {
      color: var(--branco);
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="pagina">
    <img class="logo" src="logo-branco.png" alt="Fever">

    <div class="avatar">
      <span>RA</span>
      <img src="foto.jpg" alt="Rafael Appugliese" onerror="this.remove()">
    </div>

    <h1>Rafael Appugliese</h1>
    <p class="cargo">Music &amp; Nightlife Senior Market Strategy and Partnerships Manager</p>
    <img class="logo-tag" src="logo-branco.png" alt="Fever">

    <section class="acoes">
      <a class="btn principal" href="https://wa.me/5511999008555" target="_blank" rel="noopener">
        <span class="icone">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5A11 11 0 0 0 3.2 17.3L2 22l4.8-1.2A11 11 0 1 0 20.5 3.5zM12 20.2a9.2 9.2 0 0 1-4.7-1.3l-.3-.2-2.9.8.8-2.8-.2-.3A9.2 9.2 0 1 1 12 20.2zm5-6.9c-.3-.1-1.6-.8-1.8-.9s-.4-.1-.6.1-.7.9-.8 1-.3.2-.6.1a7.5 7.5 0 0 1-2.2-1.4 8.3 8.3 0 0 1-1.5-1.9c-.2-.3 0-.5.1-.6l.4-.5.3-.4c.1-.2 0-.3 0-.5l-.8-2c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 2.9 2.9 0 0 0-.9 2.2 5 5 0 0 0 1.1 2.7 11.4 11.4 0 0 0 4.4 3.9c.6.3 1.1.4 1.5.5a3.6 3.6 0 0 0 1.7.1 2.8 2.8 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c0-.1-.2-.2-.5-.3z"/></svg>
        </span>
        <span class="texto">WhatsApp</span>
        <span class="seta">›</span>
      </a>

      <a class="btn" href="tel:+5511999008555">
        <span class="icone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
        </span>
        <span class="texto">Ligar</span>
        <span class="seta">›</span>
      </a>

      <a class="btn" href="https://www.linkedin.com/in/appugliese/" target="_blank" rel="noopener">
        <span class="icone">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.4 20.5h-3.6v-5.6c0-1.3 0-3-1.8-3s-2.1 1.4-2.1 2.9v5.7H9.4V9h3.4v1.6c.5-.9 1.6-1.8 3.4-1.8 3.6 0 4.3 2.4 4.3 5.5v6.2zM5.3 7.4a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2zM7.1 20.5H3.5V9h3.6v11.5z"/></svg>
        </span>
        <span class="texto">LinkedIn</span>
        <span class="seta">›</span>
      </a>

      <a class="btn" href="https://www.feverup.com" target="_blank" rel="noopener">
        <span class="icone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
        </span>
        <span class="texto">Site da Fever</span>
        <span class="seta">›</span>
      </a>

      <button class="btn" id="salvar" type="button">
        <span class="icone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
        </span>
        <span class="texto">Salvar contato</span>
        <span class="seta">›</span>
      </button>
    </section>

    <p class="rodape">
      <a href="tel:+5511999008555">+55 11 99900-8555</a>
    </p>
  </main>

  <script>
    const vcard = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:Appugliese;Rafael;;;",
      "FN:Rafael Appugliese",
      "ORG:Fever",
      "TITLE:Music & Nightlife Senior Market Strategy and Partnerships Manager",
      "TEL;TYPE=CELL,VOICE:+5511999008555",
      "URL:https://www.linkedin.com/in/appugliese/",
      "END:VCARD"
    ].join("\r\n");

    document.getElementById("salvar").addEventListener("click", () => {
      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "rafael-appugliese.vcf";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
