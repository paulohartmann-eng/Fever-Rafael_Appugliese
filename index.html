<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b2333">
  <title>Rafael Appugliese | Fever</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0b2333;
      --navy-2: #12324a;
      --azul: #0079ca;
      --azul-claro: #e8f3fb;
      --texto: #0b2333;
      --texto-2: #5b6b78;
      --linha: #e3e8ed;
      --fundo: #f5f7f9;
      --branco: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--fundo); }
    body {
      font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--texto);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    .pagina {
      max-width: 460px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--branco);
      display: flex;
      flex-direction: column;
    }

    /* Cabeçalho */
    .header {
      background: var(--navy);
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header .logo { height: 26px; width: auto; display: block; }
    .header .secao {
      font-size: 0.8rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75);
    }

    /* Destaque */
    .hero {
      background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%);
      color: var(--branco);
      padding: 28px 20px 32px;
    }
    .rotulo {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--azul);
      color: var(--branco);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }
    .perfil {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      background: var(--azul);
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
    }
    .avatar span { font-size: 1.8rem; font-weight: 800; color: var(--branco); }
    .avatar img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    h1 {
      font-size: 1.55rem;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.4px;
    }
    .empresa {
      margin-top: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
    }
    .cargo {
      margin-top: 20px;
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.9);
    }
    .cta {
      margin-top: 24px;
      display: flex;
      gap: 10px;
    }
    .botao {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 16px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.2s ease;
    }
    .botao:active { transform: scale(0.98); }
    .botao svg { width: 18px; height: 18px; }
    .botao.primario { background: var(--azul); color: var(--branco); }
    .botao.primario:hover { background: #006bb3; }
    .botao.secundario {
      background: rgba(255, 255, 255, 0.1);
      color: var(--branco);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    /* Atalhos */
    .secao-conteudo { padding: 32px 20px 8px; }
    h2 {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .grade {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .tile {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 18px 16px;
      border: 1px solid var(--linha);
      border-radius: 14px;
      background: var(--branco);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.12s ease;
    }
    .tile:hover { border-color: var(--azul); box-shadow: 0 8px 20px rgba(11, 35, 51, 0.08); }
    .tile:active { transform: scale(0.98); }
    .tile .icone {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--azul-claro);
      color: var(--azul);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tile .icone svg { width: 20px; height: 20px; }
    .tile strong { font-size: 0.95rem; font-weight: 700; display: block; }
    .tile small {
      display: block;
      margin-top: 3px;
      font-size: 0.8rem;
      color: var(--texto-2);
      font-weight: 500;
    }
