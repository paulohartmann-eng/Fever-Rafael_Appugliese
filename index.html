<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rafael Appugliese</title>
  <style>
    :root {
      --bg: #0f0f12;
      --card: #1a1a22;
      --texto: #f5f5f7;
      --secundario: #a1a1aa;
      --destaque: #ff3d7f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--texto);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 20px;
      padding: 36px 24px 28px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }
    .foto {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--destaque);
      margin: 0 auto 16px;
      display: block;
    }
    h1 { font-size: 1.6rem; font-weight: 700; }
    .cargo {
      margin-top: 8px;
      font-size: 0.95rem;
      color: var(--secundario);
      line-height: 1.4;
    }
    .empresa {
      display: inline-block;
      margin-top: 14px;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--destaque);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .botoes {
      margin-top: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn:hover { opacity: 0.9; }
    .whatsapp { background: #25d366; color: #0b1f12; }
    .tel { background: #3b82f6; }
    .linkedin { background: #0a66c2; }
    .fever { background: #2a2a36; border: 1px solid #3a3a48; }
    .salvar { background: var(--destaque); }
    .rodape {
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--secundario);
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="foto" src="foto.jpg" alt="Rafael Appugliese">
    <h1>Rafael Appugliese</h1>
    <p class="cargo">Music &amp; Nightlife Senior Market Strategy and Partnerships Manager</p>
    <span class="empresa">FEVER</span>

    <div class="botoes">
      <a class="btn whatsapp" href="https://wa.me/5511999008555" target="_blank" rel="noopener">WhatsApp</a>
      <a class="btn tel" href="tel:+5511999008555">Ligar</a>
      <a class="btn linkedin" href="https://www.linkedin.com/in/appugliese/" target="_blank" rel="noopener">LinkedIn</a>
      <a class="btn fever" href="https://www.feverup.com" target="_blank" rel="noopener">Site da Fever</a>
      <button class="btn salvar" id="salvar">Salvar contato</button>
    </div>

    <p class="rodape">+55 11 99900-8555</p>
  </main>

  <script>
    const vcard = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      "N:Appugliese;Rafael;;;",
      "FN:Rafael Appugliese",
      "ORG:Fever",
      "TITLE:Music & Nightlife Senior Market Strategy and Partnerships Manager",
      "TEL;TYPE=CELL,VOICE:+5511999008555",
      "URL:https://www.linkedin.com/in/appugliese/",
      "END:VCARD"
    ].join("\r\n");

    document.getElementById("salvar").addEventListener("click", () => {
      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "rafael-appugliese.vcf";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
